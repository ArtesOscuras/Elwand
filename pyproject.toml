[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elwand"
version = "1.0.0"
description = "Elwand - Your AI-Powered Security Workbench"
requires-python = ">=3.11"
dependencies = [
    "zeroconf>=0.149.0",
    "scapy>=2.6.0",
    "pyobjc-framework-CoreWLAN>=10.0; sys_platform == 'darwin'",
    "impacket>=0.11.0",
    "Pillow>=10.0.0",
    "websocket-client>=1.6.0",
    "paramiko>=3.0.0",
    "requests>=2.31.0",
    "curl_cffi>=0.6.0",
    "prompt-toolkit>=3.0.0",
    "openai>=1.0.0",
    "html2text>=2025.0.0",
]

[project.scripts]
elwand = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["fonts/*", "icons/*", "data/*", "lst/*", "rules/*"]
